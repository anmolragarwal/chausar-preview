<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening Chausar Room...</title>
  <script>
    (function() {
      var base = '/chausar-preview/';
      var path = window.location.pathname;
      var route = path.startsWith(base) ? '/' + path.slice(base.length) : '/';
      var target = window.location.origin + base + '#' + route + window.location.search;
      window.location.replace(target);
    })();
  </script>
</head>
<body style="background:#14070A;color:#F4D678;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  Opening Chausar Private Room...
</body>
</html>
